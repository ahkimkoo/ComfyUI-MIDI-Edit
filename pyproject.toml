[project]
name = "ComfyUI-MIDI-Edit"
description = "ComfyUI custom node for MIDI lyrics editing. Replace lyrics in MIDI JSON with auto-generated phonemes (Chinese pinyin / English phonemes), or extract lyrics text. Works with ComfyUI_RH_SoulX-Singer for custom song generation."
version = "3.0.0"
license = {file = "LICENSE"}

dependencies = [
    "g2pM>=0.1.2.5",
    "g2p_en>=2.1.0",
    "jieba>=0.42.1",
    "omegaconf>=2.3.0",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy<2.0.0",
    "funasr>=1.3.0",
    "einops>=0.8.2",
    "huggingface_hub>=0.20.0",
]

[project.urls]
Repository = "https://github.com/ahkimkoo/ComfyUI-MIDI-Edit"
Documentation = "https://github.com/ahkimkoo/ComfyUI-MIDI-Edit#readme"
"Bug Tracker" = "https://github.com/ahkimkoo/ComfyUI-MIDI-Edit/issues"

[tool.comfy]
PublisherId = "ahkimkoo"
DisplayName = "ComfyUI MIDI Edit"
Icon = ""
includes = []
